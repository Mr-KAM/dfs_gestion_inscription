{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% macro body() %}
  <div class="text-center py-5">
    <div class="eyebrow">Erreur {{ code }}</div>
    <h1 class="page-title my-2">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Retour à l'accueil</a>
  </div>
{% endmacro %}
{% block content %}{{ body() }}{% endblock %}
{% block public %}<div class="login-page justify-content-center">{{ body() }}</div>{% endblock %}
